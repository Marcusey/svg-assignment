<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkande och snurrande SVG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Blinkande och snurrande SVG-pumpa inför halloween!</h1>
    
    <div class="pumpkin-frame">
        <div id="pumpkin-container">
            <object type="image/svg+xml" data="assets/pumpkin.svg" id="pumpkin"></object>
            <object type="image/svg+xml" data="assets/eyeleft.svg" id="eye-left"></object>
            <object type="image/svg+xml" data="assets/eyeright.svg" id="eye-right"></object>
            <object type="image/svg+xml" data="assets/leaftleft.svg" id="leaf-left"></object>
            <object type="image/svg+xml" data="assets/leafright.svg" id="leaf-right"></object>
            <object type="image/svg+xml" data="assets/middlestick.svg" id="middlestick"></object>
            <object type="image/svg+xml" data="assets/mouth.svg" id="mouth"></object>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
